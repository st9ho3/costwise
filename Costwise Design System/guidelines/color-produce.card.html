<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}body{padding:16px 18px}.sw{display:flex;flex-wrap:wrap;gap:10px}.sw>div{display:flex;flex-direction:column;gap:5px;min-width:88px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(27,26,22,.06)}.nm{font:var(--weight-bold) var(--text-2xs)/1.2 var(--font-body);color:var(--text-strong)}.hx{font:400 10px/1 var(--font-mono);color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:12px}</style></head><body><div class="sw"><div><div class="chip" style="background:var(--clay-600)"></div><div class="nm">clay 600</div><div class="hx">clay-600</div></div><div><div class="chip" style="background:var(--clay-500)"></div><div class="nm">clay 500</div><div class="hx">clay-500</div></div><div><div class="chip" style="background:var(--clay-300)"></div><div class="nm">clay 300</div><div class="hx">clay-300</div></div><div><div class="chip" style="background:var(--clay-100)"></div><div class="nm">clay 100</div><div class="hx">clay-100</div></div><div><div class="chip" style="background:var(--tomato-600)"></div><div class="nm">tomato 600</div><div class="hx">tomato-600</div></div><div><div class="chip" style="background:var(--tomato-500)"></div><div class="nm">tomato 500</div><div class="hx">tomato-500</div></div><div><div class="chip" style="background:var(--berry-500)"></div><div class="nm">berry 500</div><div class="hx">berry-500</div></div><div><div class="chip" style="background:var(--berry-100)"></div><div class="nm">berry 100</div><div class="hx">berry-100</div></div><div><div class="chip" style="background:var(--blueberry-500)"></div><div class="nm">blueberry 500</div><div class="hx">blueberry-500</div></div><div><div class="chip" style="background:var(--blueberry-100)"></div><div class="nm">blueberry 100</div><div class="hx">blueberry-100</div></div></div></body></html>
