<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}body{padding:16px 18px}.sw{display:flex;flex-wrap:wrap;gap:10px}.sw>div{display:flex;flex-direction:column;gap:5px;min-width:88px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(27,26,22,.06)}.nm{font:var(--weight-bold) var(--text-2xs)/1.2 var(--font-body);color:var(--text-strong)}.hx{font:400 10px/1 var(--font-mono);color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:12px}</style></head><body><div class="sw"><div><div class="chip" style="background:var(--cream-50)"></div><div class="nm">cream 50</div><div class="hx">cream-50</div></div><div><div class="chip" style="background:var(--cream-100)"></div><div class="nm">cream 100</div><div class="hx">cream-100</div></div><div><div class="chip" style="background:var(--cream-200)"></div><div class="nm">cream 200</div><div class="hx">cream-200</div></div><div><div class="chip" style="background:var(--sand-300)"></div><div class="nm">sand 300</div><div class="hx">sand-300</div></div><div><div class="chip" style="background:var(--sand-400)"></div><div class="nm">sand 400</div><div class="hx">sand-400</div></div><div><div class="chip" style="background:var(--stone-500)"></div><div class="nm">stone 500</div><div class="hx">stone-500</div></div><div><div class="chip" style="background:var(--stone-600)"></div><div class="nm">stone 600</div><div class="hx">stone-600</div></div><div><div class="chip" style="background:var(--ink-700)"></div><div class="nm">ink 700</div><div class="hx">ink-700</div></div><div><div class="chip" style="background:var(--ink-800)"></div><div class="nm">ink 800</div><div class="hx">ink-800</div></div><div><div class="chip" style="background:var(--ink-900)"></div><div class="nm">ink 900</div><div class="hx">ink-900</div></div></div></body></html>
