<!-- @dsCard group="Colors" viewport="700x190" name="Cost status" subtitle="good / watch / over — Costwise's language for a number, plus info and agent" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}body{padding:16px 18px}.sw{display:flex;flex-wrap:wrap;gap:10px}.sw>div{display:flex;flex-direction:column;gap:5px;min-width:88px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(27,26,22,.06)}.nm{font:var(--weight-bold) var(--text-2xs)/1.2 var(--font-body);color:var(--text-strong)}.hx{font:400 10px/1 var(--font-mono);color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:12px}</style></head><body><div style="display:flex;flex-wrap:wrap;gap:10px">
<div style="flex:1;min-width:120px;background:var(--good-soft);border-radius:var(--radius-md);padding:12px 13px">
<div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:var(--good)"></span><span style="font:var(--weight-bold) var(--text-sm)/1 var(--font-body);color:var(--good-text)">good</span></div>
<div style="font:var(--type-caption);color:var(--good-text);opacity:.8;margin-top:6px">On target</div>
<div style="font:400 10px/1.5 var(--font-mono);color:var(--good-text);opacity:.62;margin-top:8px">good<br>good-soft</div></div><div style="flex:1;min-width:120px;background:var(--watch-soft);border-radius:var(--radius-md);padding:12px 13px">
<div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:var(--watch)"></span><span style="font:var(--weight-bold) var(--text-sm)/1 var(--font-body);color:var(--watch-text)">watch</span></div>
<div style="font:var(--type-caption);color:var(--watch-text);opacity:.8;margin-top:6px">Drifting</div>
<div style="font:400 10px/1.5 var(--font-mono);color:var(--watch-text);opacity:.62;margin-top:8px">watch<br>watch-soft</div></div><div style="flex:1;min-width:120px;background:var(--over-soft);border-radius:var(--radius-md);padding:12px 13px">
<div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:var(--over)"></span><span style="font:var(--weight-bold) var(--text-sm)/1 var(--font-body);color:var(--over-text)">over</span></div>
<div style="font:var(--type-caption);color:var(--over-text);opacity:.8;margin-top:6px">Over target</div>
<div style="font:400 10px/1.5 var(--font-mono);color:var(--over-text);opacity:.62;margin-top:8px">over<br>over-soft</div></div><div style="flex:1;min-width:120px;background:var(--info-soft);border-radius:var(--radius-md);padding:12px 13px">
<div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:var(--info)"></span><span style="font:var(--weight-bold) var(--text-sm)/1 var(--font-body);color:var(--info-text)">info</span></div>
<div style="font:var(--type-caption);color:var(--info-text);opacity:.8;margin-top:6px">Price changed</div>
<div style="font:400 10px/1.5 var(--font-mono);color:var(--info-text);opacity:.62;margin-top:8px">info<br>info-soft</div></div><div style="flex:1;min-width:120px;background:var(--agent-soft);border-radius:var(--radius-md);padding:12px 13px">
<div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:var(--agent)"></span><span style="font:var(--weight-bold) var(--text-sm)/1 var(--font-body);color:var(--agent-text)">agent</span></div>
<div style="font:var(--type-caption);color:var(--agent-text);opacity:.8;margin-top:6px">Costwise found</div>
<div style="font:400 10px/1.5 var(--font-mono);color:var(--agent-text);opacity:.62;margin-top:8px">agent<br>agent-soft</div></div>
</div></body></html>
