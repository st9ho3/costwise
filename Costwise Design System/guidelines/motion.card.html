<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Fast, soft, one small overshoot. Hover lifts 1px, press shrinks to 0.975" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}body{padding:16px 18px}.sw{display:flex;flex-wrap:wrap;gap:10px}.sw>div{display:flex;flex-direction:column;gap:5px;min-width:88px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(27,26,22,.06)}.nm{font:var(--weight-bold) var(--text-2xs)/1.2 var(--font-body);color:var(--text-strong)}.hx{font:400 10px/1 var(--font-mono);color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:12px}.chip{}</style></head><body><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px 14px;font:var(--type-label);color:var(--text-strong)">fast 140ms</div><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px 14px;font:var(--type-label);color:var(--text-strong)">base 200ms</div><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px 14px;font:var(--type-label);color:var(--text-strong)">slow 320ms</div>
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px 14px"><div class="nm">hover</div><div class="hx">translateY(-1px)</div></div>
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px 14px"><div class="nm">press</div><div class="hx">scale(.975)</div></div>
</div>
<div style="font:400 10px/1.8 var(--font-mono);color:var(--text-muted);margin-top:14px">--ease-out-soft cubic-bezier(.2,.8,.25,1) — default<br>--ease-nudge cubic-bezier(.34,1.4,.64,1) — ticks, knobs, dialogs only<br>all motion collapses to 0ms under prefers-reduced-motion</div></body></html>
