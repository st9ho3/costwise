<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}body{padding:16px 18px}.sw{display:flex;flex-wrap:wrap;gap:10px}.sw>div{display:flex;flex-direction:column;gap:5px;min-width:88px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(27,26,22,.06)}.nm{font:var(--weight-bold) var(--text-2xs)/1.2 var(--font-body);color:var(--text-strong)}.hx{font:400 10px/1 var(--font-mono);color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">

(--weight-bold) var(--text-sm)/1 var(--font-body)">Brand soft</div><div style="font:400 10px/1.5 var(--font-mono);opacity:.72;margin-top:6px">surface-brand-soft</div></div><div style="background:var(--surface-accent-soft);color:var(--text-on-accent);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 12px 10px;min-height:70px"><div style="font:var(--weight-bold) var(--text-sm)/1 var(--font-body)">Agent note</div><div style="font:400 10px/1.5 var(--font-mono);opacity:.72;margin-top:6px">surface-accent-soft</div></div><div style="background:var(--surface-warm-soft);color:var(--clay-700);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 12px 10px;min-height:70px"><div style="font:var(--weight-bold) var(--text-sm)/1 var(--font-body)">Warm soft</div><div style="font:400 10px/1.5 var(--font-mono);opacity:.72;margin-top:6px">surface-warm-soft</div></div>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:baseline">
