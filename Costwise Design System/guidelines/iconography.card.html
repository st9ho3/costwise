<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}body{padding:16px 18px}.sw{display:flex;flex-wrap:wrap;gap:10px}.sw>div{display:flex;flex-direction:column;gap:5px;min-width:88px}.chip{height:52px;border-radius:var(--radius-md);border:1px solid rgba(27,26,22,.06)}.nm{font:var(--weight-bold) var(--text-2xs)/1.2 var(--font-body);color:var(--text-strong)}.hx{font:400 10px/1 var(--font-mono);color:var(--text-muted)}.row{display:flex;align-items:baseline;gap:12px}</style></head><body><div id="ic" style="display:flex;flex-wrap:wrap;gap:18px;color:var(--green-800)"></div>

const box=document.getElementById('ic');
box.innerHTML=names.map(n=>'<span style="display:flex;flex-direction:column;align-items:center;gap:6px;width:56px"><i data-lucide="'+n+'"></i><span style="font:400 9px/1.2 var(--font-mono);color:var(--text-muted);text-align:center">'+n+'</span></span>').join('');
