<script type="text/babel" data-presets="react">
const {Icon}=window.CostwiseDesignSystem_f2dfa3;

const {ChatBubble,SuggestionChip,Composer,Avatar,IconButton,ProgressMeter,Card}=window.CostwiseDesignSystem_f2dfa3;
const App=()=>(<div className="cwc-col" style={{gap:14}}>
  <ChatBubble avatar={<Avatar agent src="../../assets/logo-mark-transparent.png"/>} meta="Just now"
    attachment={<Card padding="tight"><ProgressMeter label="Carbonara" value={3.9} max={6} target={4.2} tone="watch" display="€3.90"/></Card>}>

  </ChatBubble>
  <ChatBubble from="me">So should I put the price up?</ChatBubble>
  <ChatBubble tone="note" avatar={<Avatar agent src="../../assets/logo-mark-transparent.png"/>}>
    €15.50 keeps you at a 68% margin, even if eggs stay high. That's 50c more than now.
  </ChatBubble>
  <div className="cwc-row">
    <SuggestionChip icon={<Icon name="receipt-text" size={15}/>}>Snap a supplier invoice</SuggestionChip>
    <SuggestionChip variant="accent">Why did my margin drop?</SuggestionChip>
    <SuggestionChip variant="soft">Cheapest dish to push</SuggestionChip>
    <SuggestionChip variant="filter" selected>Dishes</SuggestionChip>
    <SuggestionChip variant="filter">Suppliers</SuggestionChip>
  </div>
  <Composer value="" lead={<Icon name="sparkles" size={16}/>} sendIcon={<Icon name="arrow-up" size={18}/>}
    tools={<><IconButton size="sm" round icon={<Icon name="camera" size={18}/>} label="Snap an invoice"/><IconButton size="sm" round icon={<Icon name="mic" size={18}/>} label="Speak"/></>}/>
</div>);

lucide.createIcons();
