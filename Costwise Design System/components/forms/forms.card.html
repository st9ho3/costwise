<style>html,body{margin:0;background:var(--surface-page)}#root{padding:18px 20px}.cwc-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.cwc-col{display:flex;flex-direction:column;gap:12px}.cwc-lbl{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}.cwc-grid{display:grid;gap:14px}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const {Icon}=window.CostwiseDesignSystem_f2dfa3;

const {Input,MoneyInput,Select,Checkbox,Switch}=window.CostwiseDesignSystem_f2dfa3;
const App=()=>(<div className="cwc-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
  <Input label="Ingredient" placeholder="e.g. San Marzano tomatoes" icon={<Icon name="search" size={18}/>}/>
  <Input label="Pack size" suffix="kg" defaultValue="2.5" hint="What you buy, not what the recipe uses."/>
  <MoneyInput label="Buy price" per="kg" defaultValue="3.40"/>
  <MoneyInput label="Menu price" size="lg" defaultValue="14.50"/>
  <Select label="Supplier" options={['Bidfood','Metro','Local market']} chevron={<Icon name="chevron-down" size={16}/>}/>
  <Input label="Invoice ref" error="We need a reference to file this." defaultValue=""/>
  <div className="cwc-col" style={{gap:10}}>
    <Checkbox label="Count this in food cost" defaultChecked/>
    <Checkbox label="Remind me on Mondays" description="A nudge before the weekly order goes in."/>
  </div>
  <div className="cwc-col" style={{gap:10}}>
    <Switch label="Weekly cost recap" description="Mondays, 8am." defaultChecked/>
    <Switch label="Include VAT" size="sm"/>
  </div>
</div>);
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
lucide.createIcons();
