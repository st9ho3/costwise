<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--surface-page)}#root{padding:18px 20px}.cwc-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.cwc-col{display:flex;flex-direction:column;gap:12px}.cwc-lbl{font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}.cwc-grid{display:grid;gap:14px}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const {Icon}=window.CostwiseDesignSystem_f2dfa3;

const {Tabs,SidebarNav,Card}=window.CostwiseDesignSystem_f2dfa3;
const {useState}=React;
const App=()=>{const [t,setT]=useState('week');const [u,setU]=useState('Dishes');const [v,setV]=useState('dishes');
 return <div className="cwc-grid" style={{gridTemplateColumns:'1fr 248px',alignItems:'start',gap:20}}>
  <div className="cwc-col" style={{gap:18}}>
    <div><div className="cwc-lbl">Pill tabs</div><Tabs value={t} onChange={setT} items={[{value:'week',label:'This week'},{value:'month',label:'Month'},{value:'year',label:'Year',count:4}]}/></div>
    <div><div className="cwc-lbl">Block</div><Tabs block value={t} onChange={setT} items={[{value:'week',label:'This week'},{value:'month',label:'Month'},{value:'year',label:'Year'}]}/></div>
    <div><div className="cwc-lbl">Underline</div><Tabs variant="underline" value={u} onChange={setU} items={['Dishes','Ingredients','Suppliers']}/></div>
  </div>
  <Card padding="tight"><SidebarNav value={v} onChange={setV} items={[
    {value:'today',label:'Today',icon:<Icon name="house"/>},
    {value:'chat',label:'Ask Costwise',icon:<Icon name="sparkles"/>},
    {group:'Kitchen'},
    {value:'dishes',label:'Dishes',icon:<Icon name="utensils"/>,badge:'3'},
    {value:'ingredients',label:'Ingredients',icon:<Icon name="carrot"/>},
    {value:'invoices',label:'Invoices',icon:<Icon name="receipt-text"/>}]}/></Card>
</div>;};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
lucide.createIcons();
</script></body></html>
