<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>html,body{margin:0;height:854px;width:1280px;overflow:hidden}.tile{display:grid;grid-template-columns:1fr 300px;height:854px}.main{background:var(--green-800);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}.main img{width:260px;height:260px;display:block}.name{font-family:var(--font-logotype);font-weight:800;font-size:132px;line-height:1;letter-spacing:-.02em;color:var(--cream-50)}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%}</style></head><body><div class="tile"><div class="main"><img src="assets/logo-mark.png" alt=""><div class="name">Costwise</div></div><div class="strip"><div style="background:var(--gold-400)"></div><div style="background:var(--green-400)"></div><div style="background:var(--clay-500)"></div><div style="background:var(--green-600)"></div></div></div></body></html>
